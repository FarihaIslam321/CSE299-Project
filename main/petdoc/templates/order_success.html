{% extends "partial/base.html" %}
{% block content %}

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        
        <div class="card-body text-center p-5">
          <div class="mb-4">
            <div class="mx-auto d-flex align-items-center justify-content-center rounded-circle bg-success bg-opacity-10"
                 style="width: 90px; height: 90px;">
              <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
            </div>
          </div>

          <h2 class="fw-bold text-success mb-3">Order Placed Successfully!</h2>
          <p class="text-muted fs-5 mb-4">
            Thank you for your order. Your order has been placed successfully and is now being processed.
          </p>

          <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
            <a href="{% url 'home' %}" class="btn btn-primary px-4 py-2 rounded-pill">
              Back to Home
            </a>
            <a href="{% url 'shop_page' %}" class="btn btn-outline-success px-4 py-2 rounded-pill">
              Continue Shopping
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

{% endblock %}
