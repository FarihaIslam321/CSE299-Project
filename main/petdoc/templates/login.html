{% extends "partial/base.html" %}
{% load static %}
{% block content %}

<main class="main">

  <!-- Login Section -->
  <section id="login" class="login section">
    <div class="container" data-aos="fade-up" data-aos-delay="100">

      <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
          <div class="auth-container" data-aos="fade-in" data-aos-delay="200">

            <!-- Login Form -->
            <div class="auth-form login-form active">
              <div class="form-header">
                <h3>Welcome Back</h3>
                <p>Sign in to your account</p>
              </div>

              <!-- Display Django messages -->
              {% if messages %}
              <div class="mb-3">
                {% for message in messages %}
                  <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
                    {{ message }}
                  </div>
                {% endfor %}
              </div>
              {% endif %}

              <form class="auth-form-content" method="POST">
                {% csrf_token %}
                <div class="input-group mb-3">
                  <span class="input-icon">
                    <i class="bi bi-envelope"></i>
                  </span>
                  <input type="email" name="email" class="form-control" placeholder="Email address" required autocomplete="email" id="email">
                </div>

                <div class="input-group mb-3">
                  <span class="input-icon">
                    <i class="bi bi-lock"></i>
                  </span>
                  <input type="password" name="password" class="form-control" placeholder="Password" required autocomplete="current-password" id="password">
                  <span class="password-toggle" onclick="togglePassword()">
                    <i class="bi bi-eye" id="password-toggle-icon"></i>
                  </span>
                </div>

                <div class="form-options mb-4">
                  <div class="remember-me">
                    <input type="checkbox" id="rememberLogin" name="remember">
                    <label for="rememberLogin">Remember me</label>
                  </div>
                  <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="auth-btn primary-btn mb-3">
                  Sign In
                  <i class="bi bi-arrow-right"></i>
                </button>

                <div class="divider">
                  <span>or</span>
                </div>

                <button type="button" class="auth-btn social-btn">
                  <i class="bi bi-google"></i>
                  Continue with Google
                </button>

                <div class="switch-form">
                  <span>Don't have an account?</span>
                  <a href="{% url 'register' %}" class="switch-btn">Create account</a>
                </div>
              </form>
            </div>

          </div>
        </div>
      </div>

    </div>
  </section><!-- /Login Section -->

</main>

{% endblock content %}

<script>
  // Function to toggle password visibility
  function togglePassword() {
    const passwordField = document.getElementById('password');
    const passwordToggleIcon = document.getElementById('password-toggle-icon');

    if (passwordField.type === "password") {
      passwordField.type = "text";
      passwordToggleIcon.classList.remove("bi-eye");
      passwordToggleIcon.classList.add("bi-eye-slash");
    } else {
      passwordField.type = "password";
      passwordToggleIcon.classList.remove("bi-eye-slash");
      passwordToggleIcon.classList.add("bi-eye");
    }
  }
</script>
