{% extends 'base.html' %} {% block content %}
<style>
    /* --- Professional Chat Interface Styling --- */
    .chat-wrapper {
        max-width: 800px;
        margin: 40px auto;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        display: flex;
        flex-direction: column;
        height: 70vh; /* Takes up 70% of the screen height */
        border: 1px solid #e0e0e0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .chat-header {
        background: #2c3e50;
        color: white;
        padding: 20px;
        border-radius: 12px 12px 0 0;
        text-align: center;
        border-bottom: 2px solid #1a252f;
    }

    .chat-header h2 { margin: 0; font-size: 1.5rem; }
    .chat-header p { margin: 5px 0 0 0; font-size: 0.9rem; opacity: 0.8; }

    .chat-history {
        flex-grow: 1;
        padding: 20px;
        overflow-y: auto;
        background: #f8f9fa;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    /* Message Bubbles */
    .msg-row { display: flex; width: 100%; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .bubble {
        max-width: 75%;
        padding: 12px 18px;
        border-radius: 18px;
        font-size: 1rem;
        line-height: 1.5;
        word-wrap: break-word;
    }

    .bubble.user-bubble {
        background: #3498db;
        color: white;
        border-bottom-right-radius: 4px;
        box-shadow: 0 2px 5px rgba(52, 152, 219, 0.3);
    }

    .bubble.ai-bubble {
        background: #ffffff;
        color: #333;
        border: 1px solid #e0e0e0;
        border-bottom-left-radius: 4px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    /* Input Area */
    .chat-input-area {
        padding: 20px;
        background: #ffffff;
        border-top: 1px solid #e0e0e0;
        border-radius: 0 0 12px 12px;
        display: flex;
        gap: 10px;
    }

    .chat-input-area textarea {
        flex-grow: 1;
        resize: none;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 1rem;
        font-family: inherit;
        outline: none;
        transition: border 0.3s;
    }

    .chat-input-area textarea:focus { border-color: #3498db; }

    .send-btn {
        background: #27ae60;
        color: white;
        border: none;
        padding: 0 25px;
        border-radius: 8px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.3s;
    }

    .send-btn:hover { background: #219653; }
    .send-btn:disabled { background: #95a5a6; cursor: not-allowed; }

    /* Typing Indicator Animation */
    .typing { display: none; padding: 12px 18px; background: #e9ecef; border-radius: 18px; width: fit-content; align-self: flex-start; margin-bottom: 15px; }
    .dot { display: inline-block; width: 8px; height: 8px; background: #888; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
</style>

<div class="container">
    <div class="chat-wrapper">
        <div class="chat-header">
            <h2>Smart Vet AI</h2>
            <p>Powered by your custom-trained machine learning model</p>
        </div>

        <div class="chat-history" id="chat-box">
            <div class="msg-row ai">
                <div class="bubble ai-bubble">
                    Hello! I am your AI Veterinary Assistant. Please describe your pet's symptoms in detail, and I will analyze them.
                </div>
            </div>
        </div>

        <div class="typing" id="typing-indicator">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>

        <form class="chat-input-area" id="chat-form">
            {% csrf_token %}
            <textarea id="user-input" rows="2" placeholder="E.g., My dog has been vomiting and has a high fever since yesterday..."></textarea>
            <button type="submit" id="send-button" class="send-btn">Send</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const form = document.getElementById('chat-form');
        const inputField = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const typingIndicator = document.getElementById('typing-indicator');
        const sendButton = document.getElementById('send-button');

        // Function to scroll to the bottom of the chat
        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Function to parse basic Markdown (converts **text** to bold and \n to <br>)
        function formatAIResponse(text) {
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

        form.addEventListener('submit', async function(e) {
            e.preventDefault(); // Stop page from refreshing
            
            const userText = inputField.value.trim();
            if (!userText) return; // Do nothing if input is empty

            // 1. Add User's message to the screen
            const userMsgHTML = `
                <div class="msg-row user">
                    <div class="bubble user-bubble">${userText}</div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', userMsgHTML);
            
            // 2. Clear input, disable button, and show typing indicator
            inputField.value = '';
            sendButton.disabled = true;
            chatBox.appendChild(typingIndicator); // Move indicator to bottom
            typingIndicator.style.display = 'block';
            scrollToBottom();

            // 3. Prepare data to send to Django
            const formData = new FormData();
            formData.append('prompt', userText);
            formData.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);

            try {
                // 4. Send request to your Django view asynchronously
                const response = await fetch("{% url 'ai_assistant' %}", {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                // 5. Hide typing indicator
                typingIndicator.style.display = 'none';

                // 6. Display AI's response
                let aiMsgHTML = '';
                if (data.status === 'success') {
                    const formattedText = formatAIResponse(data.reply);
                    aiMsgHTML = `
                        <div class="msg-row ai">
                            <div class="bubble ai-bubble">${formattedText}</div>
                        </div>
                    `;
                } else {
                    // Handle Errors from the backend
                    aiMsgHTML = `
                        <div class="msg-row ai">
                            <div class="bubble ai-bubble" style="color: red;"><strong>Error:</strong> ${data.message}</div>
                        </div>
                    `;
                }
                
                chatBox.insertAdjacentHTML('beforeend', aiMsgHTML);

            } catch (error) {
                // Handle network errors
                typingIndicator.style.display = 'none';
                chatBox.insertAdjacentHTML('beforeend', `
                    <div class="msg-row ai">
                        <div class="bubble ai-bubble" style="color: red;"><strong>System Error:</strong> Cannot reach the AI model. Ensure the server is running.</div>
                    </div>
                `);
            } finally {
                // 7. Re-enable button and scroll down
                sendButton.disabled = false;
                scrollToBottom();
                inputField.focus();
            }
        });

        // Allow pressing "Enter" to send message (Shift+Enter for new line)
        inputField.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                form.dispatchEvent(new Event('submit'));
            }
        });
    });
</script>
{% endblock %}
